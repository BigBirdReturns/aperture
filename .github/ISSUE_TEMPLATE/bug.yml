name: Report a problem
description: A minimal, redacted failure in installation, setup, execution, or documentation.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, private prompts, personal paths, complete hardware snapshots, or private model URLs. Security defects belong in private reporting."
  - type: input
    id: version
    attributes:
      label: Aperture version
      placeholder: "0.4.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and selected backend
      placeholder: "Windows x64, CUDA; Node 24"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failing stage
      options: [Installation, Scan, Model inspection, Download, Runtime installation, Load, Chat or generation, Experiment, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and redacted error
      description: Include the selected public model revision/representation when relevant. Explain expected and actual behavior.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and unnecessary private data from this report.
          required: true
