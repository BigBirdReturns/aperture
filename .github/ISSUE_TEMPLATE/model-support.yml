name: Model or backend support
description: Request or report one exact model, representation, and execution combination.
title: "[Support] "
body:
  - type: markdown
    attributes:
      value: "A model name alone is not enough to reproduce execution. Share public coordinates, not weights or credentials. Builds with the support command can create a reduced hardware receipt with `aperture support --allow-scan --out aperture-support.json`. Inspect that JSON before attaching it; hardware names, drivers, capacities, and timestamps can still fingerprint a machine."
  - type: input
    id: artifact
    attributes:
      label: Public model, revision, and representation
      description: Exact checkpoint or a redacted description if private.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Reduced hardware receipt or OS/backend summary
      description: Attach the reviewed Aperture support receipt when available, or describe OS, backend, GPU model, and memory capacity. Do not provide raw scans, GPU UUIDs, serial numbers, local paths, prompts, or credentials.
    validations:
      required: true
  - type: input
    id: request
    attributes:
      label: Aperture version, context, and sequence count
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Current result or missing support
      description: Distinguish inspection, predicted fit, load, and actual generation. Attach only minimal redacted errors.
    validations:
      required: true
