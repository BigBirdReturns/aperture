name: Public Aperture 0.4.5 Apple Silicon Metal passage
on:
  push:
    branches: ['qualification/macos-metal-v0.4.5-20260905']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-metal-first-use-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metal:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PACKAGE_URL: https://github.com/BigBirdReturns/aperture/releases/download/v0.4.5/bigbirdreturns-aperture-0.4.5.tgz
      PACKAGE_SHA256: 1b539bbfb6eeb315a9cbc341baf0d2978546106da3efce9ef1afd1ca43bae13e
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/blob/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf
      MODEL_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      MODEL_BYTES: '491400032'
      NODE_LINE: ${{ matrix.node }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the public Metal route and preserve admission evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('aperture-macos-metal-' + $env:NODE_LINE)
          $apertureHome = Join-Path $root 'home'
          $cache = Join-Path $root 'npm-cache'
          $public = Join-Path $root 'public'
          New-Item -ItemType Directory -Path $apertureHome,$cache,$public -Force | Out-Null
          $package = Join-Path $root 'aperture.tgz'
          Invoke-WebRequest $env:PACKAGE_URL -OutFile $package
          $packageHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packageHash -ne $env:PACKAGE_SHA256) { throw 'Public package digest mismatch.' }
          $version = (& npx --yes --cache $cache "--package=$package" aperture --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '0.4.5') { throw "Installed version mismatch: $version" }

          $supportFile = Join-Path $public 'support.json'
          & npx --yes --cache $cache "--package=$package" aperture support --allow-scan --home $apertureHome --out $supportFile
          if ($LASTEXITCODE -ne 0) { throw 'Support scan failed.' }
          $support = Get-Content -Raw $supportFile | ConvertFrom-Json
          $memoryPressure = (& /usr/bin/memory_pressure -Q 2>&1 | Out-String).Trim()
          $vmStat = (& /usr/bin/vm_stat 2>&1 | Out-String).Trim()
          $topPhys = (& /usr/bin/top -l 1 -s 0 2>&1 | Select-String '^PhysMem:' | ForEach-Object {$_.Line} | Out-String).Trim()
          $nodeMemory = (& node -e "const os=require('os');console.log(JSON.stringify({total:os.totalmem(),free:os.freemem()}))" | ConvertFrom-Json)
          $sysctlTotal = [int64](& /usr/sbin/sysctl -n hw.memsize)

          $log = Join-Path $root 'execution.log'
          $oldPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & npx --yes --cache $cache "--package=$package" aperture setup `
            --home $apertureHome --model $env:MODEL_URL --context 2048 --parallel 1 --backend metal `
            --allow-scan --allow-network --allow-download --allow-install --allow-run `
            --prompt 'What is 6 multiplied by 7? Reply with the two digits only.' --tokens 8 --seconds 600 2>&1 | Tee-Object -FilePath $log
          $executionExit = $LASTEXITCODE
          $ErrorActionPreference = $oldPreference

          $fitFile = Get-ChildItem (Join-Path $apertureHome 'fits') -Filter assessment.json -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $fit = if ($fitFile) { Get-Content -Raw $fitFile.FullName | ConvertFrom-Json } else { $null }
          $summaryFile = Get-ChildItem (Join-Path $apertureHome 'runs') -Filter summary.json -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $summary = if ($summaryFile) { Get-Content -Raw $summaryFile.FullName | ConvertFrom-Json } else { $null }
          $modelFile = Get-ChildItem (Join-Path $apertureHome 'models') -File -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Length -eq [int64]$env:MODEL_BYTES} | Select-Object -First 1
          $modelIdentity = if ($modelFile) { [ordered]@{bytes=$modelFile.Length;sha256=(Get-FileHash $modelFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} } else { $null }
          $record = [ordered]@{
            schema='aperture-public-verification/macos-metal@1';observedAt=(Get-Date).ToUniversalTime().ToString('o')
            runner=[ordered]@{os=(sw_vers -productVersion);architecture=(uname -m);node=(node --version);githubHosted=$true}
            release=[ordered]@{version='0.4.5';packageSHA256=$packageHash}
            request=[ordered]@{backend='metal';contextTokens=2048;sequences=1;threads=$null}
            memory=[ordered]@{support=$support.memory;node=[ordered]@{totalBytes=[int64]$nodeMemory.total;freeBytes=[int64]$nodeMemory.free};sysctlTotalBytes=$sysctlTotal;memoryPressure=$memoryPressure;vmStat=$vmStat;top=$topPhys}
            executionExit=$executionExit;fit=$fit;summary=$summary;modelIdentity=$modelIdentity
            logSHA256=(Get-FileHash $log -Algorithm SHA256).Hash.ToLowerInvariant()
            boundaries=@('This is a GitHub-hosted Apple Silicon runner, not an unrelated person or clean operating-system image.','Metal was explicitly selected. A forced CPU binary is a separate unsupported path in node-llama-cpp 3.20.0 on this runner.','The arithmetic prompt is a smoke assertion, not task-quality evidence.','No requirement was reduced after the run began.')
          }
          $record | ConvertTo-Json -Depth 30 | Set-Content (Join-Path $public 'macos-metal.json') -Encoding utf8
          Write-Host ('APERTURE_MACOS_METAL ' + ($record | ConvertTo-Json -Depth 30 -Compress))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aperture-0.4.5-macos-metal-node-${{ matrix.node }}
          path: ${{ runner.temp }}/aperture-macos-metal-${{ matrix.node }}/public
          if-no-files-found: warn
          retention-days: 30
